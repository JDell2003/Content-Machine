<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>{% block title %}Content Machine{% endblock %}</title>
<style>
  :root{
    --bg:#0f1116; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --ink:#eef1f6; --muted:#98a2b3; --accent:#f5a524; --ok:#3fb950; --bad:#f85149; --warn:#d29922;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding-bottom:env(safe-area-inset-bottom)}
  a{color:var(--accent)}
  header{position:sticky;top:0;z-index:5;background:rgba(15,17,22,.94);
         backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
         padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header .brand{font-weight:800;letter-spacing:.02em}
  nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  nav a{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:10px;
        text-decoration:none;color:var(--ink);font-size:14px;font-weight:600;border:1px solid var(--line)}
  nav a.on{background:var(--accent);color:#20160a;border-color:var(--accent)}
  main{padding:16px;max-width:820px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  h1{font-size:22px;margin:0 0 4px}
  h2{font-size:17px;margin:0 0 8px}
  .muted{color:var(--muted);font-size:14px}
  button,.btn{appearance:none;border:0;border-radius:12px;min-height:52px;padding:0 18px;
    font:700 16px/1 inherit;cursor:pointer;background:var(--accent);color:#20160a;width:100%}
  button.ghost,.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  button.ok{background:var(--ok);color:#06210c}
  button.bad{background:var(--bad);color:#2a0705}
  button:disabled{opacity:.5}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  input[type=file]{width:100%;padding:14px;background:var(--panel2);border:1px dashed var(--line);
    border-radius:12px;color:var(--ink)}
  input[type=password],input[type=text]{width:100%;min-height:52px;padding:0 14px;font-size:18px;
    background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--ink)}
  .bar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:10px 0 6px}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ffd479);
         transition:width .25s ease}
  .pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;
        text-transform:uppercase;letter-spacing:.04em}
  .pill.queued{background:#2a2f3a;color:var(--muted)}
  .pill.running{background:rgba(245,165,36,.18);color:var(--accent)}
  .pill.done{background:rgba(63,185,80,.16);color:var(--ok)}
  .pill.failed{background:rgba(248,81,73,.16);color:var(--bad)}
  .pill.cancelled{background:#2a2f3a;color:var(--muted)}
  .pill.pass{background:rgba(63,185,80,.16);color:var(--ok)}
  .pill.flag{background:rgba(210,153,34,.18);color:var(--warn)}
  video{width:100%;border-radius:12px;background:#000;display:block}
  /* Reframe preview: the box takes the target aspect and clips the video to it,
     so the crop you drag is the crop that gets encoded. */
  .frame{width:100%;border-radius:12px;background:#000;overflow:hidden;display:block}
  .frame video{width:100%;height:100%;border-radius:0}
  pre{white-space:pre-wrap;word-break:break-word;background:var(--panel2);padding:12px;
      border-radius:10px;font-size:12px;max-height:40vh;overflow:auto}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
  .kv:first-child{border-top:0}
  .tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
       padding:2px 8px;font-size:12px;margin:2px 4px 2px 0;color:var(--muted)}
</style>
</head>
<body>
<header>
  <span class="brand">⚙ Content Machine</span>
  <nav>
    <a href="/" class="{% block n1 %}{% endblock %}">Upload</a>
    <a href="/status" class="{% block n2 %}{% endblock %}">Jobs</a>
    <a href="/swipe" class="{% block n5 %}{% endblock %}">Swipe</a>
    <a href="/review" class="{% block n3 %}{% endblock %}">All clips</a>
    <a href="/patterns" class="{% block n6 %}{% endblock %}">Patterns</a>
    <a href="/chat" class="{% block n4 %}{% endblock %}">Chat</a>
    <a href="/logout">Lock</a>
  </nav>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
