# Postiz - light stack (app + postgres + redis). $0, runs on this PC.
#
# Bound to 127.0.0.1 on purpose. Meta's OAuth redirect only needs to be reachable
# by the BROWSER doing the connecting (which is this PC), and publishing afterwards
# is outbound Postiz -> Meta. Nothing needs to reach this from the internet, so
# nothing is exposed to the internet.
#
# Volumes live under D:\ContentMachine\postiz\data - C: has almost no free space.

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/config:/config/
      - ./data/uploads:/uploads/
    ports:
      # host:container - localhost only
      - "127.0.0.1:5000:5000"
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
    networks: [postiz-net]

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postiz-local
      POSTGRES_DB: postiz-db-local
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz-local -d postiz-db-local"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [postiz-net]

  postiz-redis:
    image: redis:7.2-alpine
    container_name: postiz-redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [postiz-net]

networks:
  postiz-net:
    external: false
